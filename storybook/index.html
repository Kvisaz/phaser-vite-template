<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phaser Storybook</title>
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      padding: 0;
      touch-action: none;
      background: #2a2a2a;
    }

    canvas {
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    .wrap {
      width: 100%;
      height: 100%;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    .sidebar {
      min-width: 200px;
      max-width: 240px;
      height: 100%;
      box-sizing: border-box;
      padding: 15px;
      overflow-y: auto;
      overflow-x: hidden;
      background: burlywood;
      font-family: Arial, sans-serif;
      font-size: 14px;
    }

    .story {
      width: calc(100% - 10px);
      box-sizing: border-box;
      margin: 5px 0;
      padding: 5px;
      border: 1px solid #dedede;
      border-radius: 5px;
      background: #b0f3b0;
      cursor: pointer;
      text-align: left;
      user-select: none;
    }

    .story:hover {
      background: #6bb06b;
    }

    .story:active,
    .story:focus {
      background: #730e77;
      color: wheat;
    }

    .storyDelimiter {
      width: 100%;
      padding: 12px 5px 5px;
      color: #3e394f;
      opacity: 0.7;
    }

    .gameWrap {
      min-width: 0;
      min-height: 0;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .gameTitle {
      width: 100%;
      box-sizing: border-box;
      padding-top: 8px;
      color: #dedede;
      font-family: Arial, sans-serif;
      font-size: 24px;
      text-align: center;
    }

    #game {
      min-height: 0;
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    #game canvas {
      position: static !important;
      max-width: 100% !important;
      max-height: 100% !important;
      width: 100% !important;
      height: 100% !important;
      object-fit: contain;
    }
  </style>
</head>
<body>
<div class="wrap">
  <div class="sidebar">
    <div id="stories"></div>
  </div>
  <div class="gameWrap">
    <div id="gameTitle" class="gameTitle">Loading...</div>
    <div id="game"></div>
  </div>
</div>
<script type="module" src="./index.ts"></script>
</body>
</html>
